<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Project</title>

<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@600;700&family=Inter:wght@300;400;500&display=swap" rel="stylesheet">

<style>

body {
    font-family: 'Inter', sans-serif;
    margin: 0;
    padding: 0;
    background: #ffffff;
    color: #111;
}

.container {
    max-width: 900px;
    margin: 120px auto;
    padding: 0 20px;
}

h1 {
    font-family: 'Space Grotesk', sans-serif;
    font-size: 42px;
}

.category {
    margin: 10px 0 30px 0;
    font-size: 14px;
    text-transform: uppercase;
    letter-spacing: 1px;
    color: #666;
}

.description {
    margin-bottom: 40px;
    line-height: 1.7;
    color: #444;
}

.tech-list span {
    display: inline-block;
    padding: 8px 14px;
    margin: 5px;
    border: 1px solid #ddd;
    background: #f5f6f8;
}

img {
    width: 100%;
    margin-bottom: 40px;
}

</style>
</head>

<body>

<div class="container">
    <h1 id="project-title"></h1>
    <div class="category" id="project-category"></div>
    <img id="project-image" />
    <div class="description" id="project-description"></div>
    <div class="tech-list" id="project-tech"></div>
</div>

<script src="project.js"></script>
</body>
</html>
